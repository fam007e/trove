# Android build configurations
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Reproducibility flags from threat model / spec
android.enableR8.fullMode=true
android.enableResourceOptimizations=true
android.enableD8Desugaring=true
org.gradle.caching=false
org.gradle.configuration-cache=true
# AGP 9.x ProcessNavigationXmlTask fails CC serialization on cold CI envs
# (works locally) — downgrade problems to warnings so Gradle falls back to
# normal execution instead of failing the build.
org.gradle.configuration-cache.problems=warn
org.gradle.isolated-projects=false
