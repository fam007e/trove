name: Release build

# Builds a reproducible UNSIGNED release APK on every vYYYY.MM.DD tag.
# Signing happens ONLY on the maintainer's machine via scripts/sign-release.sh
# — the keystore and passphrase never enter CI, secrets, or artifacts.
# See signing/RELEASE_SIGNING.md for the full identity chain.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Enforce tag format vYYYY.MM.DD
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          if ! [[ "$TAG" =~ ^v([0-9]{4})\.([0-9]{2})\.([0-9]{2})$ ]]; then
            echo "::error::Tag '$TAG' does not match vYYYY.MM.DD (e.g. v2026.11.18)"; exit 1
          fi
          echo "Tag format OK: $TAG"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=${BASH_REMATCH[1]}${BASH_REMATCH[2]}${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No android-actions/setup-android: sdkmanager 16.0 removed the legacy
      # 'tools' package it tries to install, and ubuntu-latest already ships a
      # complete ANDROID_HOME (same setup ci.yml relies on).

      - name: Build unsigned release APK (version stamped from tag)
        run: >
          ./gradlew --no-daemon assembleRelease
          -Ptrove.versionName="${{ steps.tag.outputs.name }}"
          -Ptrove.versionCode="${{ steps.tag.outputs.code }}"

      - name: Confirm APK is unsigned (signing happens locally)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          if "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -q "certificate"; then
            echo "::error::APK must NOT be signed in CI"; exit 1
          fi
          echo "OK: unsigned APK built at tag ${{ github.ref_name }}"

      - name: Compute checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: trove-${{ github.ref_name }}-unsigned
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Maintainer next steps (local, not CI):
      #   1. gh run download <run-id> -n trove-<tag>-unsigned
      #   2. scripts/sign-release.sh app-release.apk <tag>
      #      -> signs, verifies fingerprint, GPG-signs, publishes release
      # Reproducibility check: rebuild locally and diff against the CI APK
      # (strip META-INF/ zip entries before comparing — see TROVE_IMPLEMENTATION.md §5).
