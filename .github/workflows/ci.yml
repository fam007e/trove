name: Trove CI & Reproducibility Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-fuzz:
    name: Unit, CVE & Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run All Tests (Unit, Security, Fuzzers)
        run: ./gradlew test --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: '**/build/reports/tests/test/'

  reproducibility-verification:
    name: F-Droid Reproducible Build Audit
    runs-on: ubuntu-latest
    needs: [test-and-fuzz]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install diffoscope, fdroidserver & tools
        run: sudo apt-get update && sudo apt-get install -y diffoscope unzip fdroidserver

      - name: Run F-Droid Metadata Lint
        run: fdroid lint com.trove.fdroid

      - name: Execute Dual-Pass Reproducibility Verification
        run: bash scripts/ci_reproducibility_test.sh

  security-audit:
    name: Dependency & CVE Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GitHub Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Scan with Trivy for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  release-build:
    name: Assemble Reproducible Release APK
    runs-on: ubuntu-latest
    needs: [test-and-fuzz, reproducibility-verification]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --no-build-cache

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: trove-release-apk
          path: app/build/outputs/apk/release/*.apk
