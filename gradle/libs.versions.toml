[versions]
agp             = "9.5.1"
kotlin          = "2.4.21"
compileSdk      = "35"
minSdk          = "26"
targetSdk       = "35"

# Third-party libraries
sshj            = "0.38.0"
jcifsNg         = "2.1.10"
bouncycastle    = "1.78.1"
conscrypt       = "2.5.2"
ktor            = "2.3.12"
minaSshd        = "2.12.1"
shizuku         = "13.1.5"
jbcrypt         = "0.4"
commonsNet      = "3.11.1"
androidxCore    = "1.13.1"
androidxAppCompat = "1.7.0"
androidxWork    = "2.9.0"
androidxRecyclerView = "1.3.2"
androidxActivity = "1.9.0"
androidxFragment = "1.8.1"
androidxViewPager2 = "1.1.0"
androidxLifecycle = "2.8.1"
androidxDocumentFile = "1.0.1"
androidxBiometric    = "1.2.0-alpha05"
kotlinxCoroutines = "1.8.1"
junit           = "4.13.2"
commonsCompress = "1.26.2"
zip4j           = "2.11.5"
xz              = "1.9"
androidxExif    = "1.3.7"
coil            = "2.7.0"
pdfboxAndroid   = "2.0.27.0"
jaudiotagger    = "3.0.1"
metadataExtractor = "2.19.0"
androidxMedia3  = "1.5.1"

[libraries]
# Toolchain & Build plugins
androidGradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlinGradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# AndroidX libraries
androidxCoreKtx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidxAppCompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppCompat" }
androidxWorkRuntime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }
androidxRecyclerView = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidxRecyclerView" }
androidxActivityKtx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
androidxFragmentKtx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidxFragment" }
androidxViewPager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "androidxViewPager2" }
androidxLifecycleRuntimeKtx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidxDocumentFile = { group = "androidx.documentfile", name = "documentfile", version.ref = "androidxDocumentFile" }
androidxBiometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidxBiometric" }
androidxExifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "androidxExif" }
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }

# Coroutines
kotlinxCoroutinesAndroid = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Security & Crypto
bouncycastleProv = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
conscryptAndroid = { group = "org.conscrypt", name = "conscrypt-android", version.ref = "conscrypt" }
jbcrypt = { group = "org.mindrot", name = "jbcrypt", version.ref = "jbcrypt" }

# Network & Clients
# Note: SMBv3 support is focused on consumer-grade (NTLMv2). 
# Enterprise Kerberos auth is out of scope for the current MVP.
sshj = { group = "com.hierynomus", name = "sshj", version.ref = "sshj" }
jcifsNg = { group = "eu.agno3.jcifs", name = "jcifs-ng", version.ref = "jcifsNg" }
commonsNet = { group = "commons-net", name = "commons-net", version.ref = "commonsNet" }

# Servers
ktorServerCore = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktorServerNetty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktorServerAuth = { group = "io.ktor", name = "ktor-server-auth", version.ref = "ktor" }

# Clients
ktorClientCore = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktorClientOkHttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }

minaSshdCore = { group = "org.apache.sshd", name = "sshd-core", version.ref = "minaSshd" }
minaSshdSftp = { group = "org.apache.sshd", name = "sshd-sftp", version.ref = "minaSshd" }

# Privilege Escalation
shizukuApi = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizukuProvider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }

# Archives
commonsCompress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
tukaaniXz = { group = "org.tukaani", name = "xz", version.ref = "xz" }

# PDF & Document
pdfboxAndroid = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }

# Metadata / Tagger
jaudiotagger = { group = "net.jthink", name = "jaudiotagger", version.ref = "jaudiotagger" }
metadataExtractor = { group = "com.drewnoakes", name = "metadata-extractor", version.ref = "metadataExtractor" }

# Media3 / ExoPlayer
androidxMedia3ExoPlayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "androidxMedia3" }
androidxMedia3Ui = { group = "androidx.media3", name = "media3-ui", version.ref = "androidxMedia3" }
androidxMedia3Session = { group = "androidx.media3", name = "media3-session", version.ref = "androidxMedia3" }
androidxMedia3Common = { group = "androidx.media3", name = "media3-common", version.ref = "androidxMedia3" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
